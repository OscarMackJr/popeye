name: Terraform

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Format And Validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Azure eastus2 root without backend
        run: terraform -chdir=envs/azure-eastus2 init -backend=false

      - name: Validate Azure eastus2 root
        run: terraform -chdir=envs/azure-eastus2 validate

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Plan 01-06 adds the step that checks the real pin file (litellm-pin.auto.tfvars).
      - name: GW-02 self-test LiteLLM advisory range checker
        run: python scripts/Test-LitellmAdvisoryRange.py --self-test
