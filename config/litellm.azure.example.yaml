# gateway-azure configuration. Copy to litellm.azure.yaml, fill in the
# pilot deployments, and ship via the mechanism chosen in the Stage 2
# ADR (config-baked internal image preferred; see the TODO in
# modules/gateway-service-azure/main.tf). Do not commit the filled copy.

model_list:
  # Azure pilot track, primary for this region.
  - model_name: twg-foundry
    litellm_params:
      model: azure/your-foundry-deployment-name   # replace with pilot deployment
      api_base: os.environ/AZURE_API_BASE
      # Preferred: managed-identity auth (role assigned in the service
      # module). API key via Key Vault only as fallback.
      api_version: os.environ/AZURE_API_VERSION

  # Cross-cloud fallback target. Configure ONLY for model groups the
  # application owners have marked cross-cloud-safe (roadmap 4.4/5).
  # - model_name: twg-claude
  #   litellm_params:
  #     model: bedrock/anthropic.claude-...      # approved model id
  #     aws_region_name: us-east-1

router_settings:
  # Fallback chains: absorb provider 429s/outages (roadmap 4.4).
  # fallbacks:
  #   - twg-foundry: ["twg-claude"]   # cross-cloud-safe groups only
  num_retries: 2
  timeout: 120
  redis_host: os.environ/REDIS_HOST
  redis_port: os.environ/REDIS_PORT

litellm_settings:
  # Guardrail (roadmap section 9): token counts and cost only; prompt
  # and completion bodies never land in the ledger. Leave false.
  store_prompts_in_spend_logs: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
